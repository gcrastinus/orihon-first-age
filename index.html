<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vademecum · 1250–1320</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="mast">
    <div class="mast-left">
      <h1>Vademecum</h1>
      <p class="lede">1250–1320 · a pocket guide to the first age — art, building, and music in time</p>
    </div>
    <nav class="centuries" id="century-nav" aria-label="Centuries"></nav>
  </header>

  <div id="stage" tabindex="0">
    <div id="paper">
      <div id="decade-rail" aria-hidden="false"></div>
      <div id="axis"></div>
      <div id="lanes"></div>
    </div>
  </div>

  <aside id="artist-panel" hidden>
    <button class="x" id="panel-x" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="lightbox" hidden>
    <button class="x light-x" id="light-x" aria-label="Close">×</button>
    <figure>
      <img id="light-img" alt="">
      <figcaption id="light-cap"></figcaption>
    </figure>
  </div>

<script src="app.js"></script>
</body>
</html>
